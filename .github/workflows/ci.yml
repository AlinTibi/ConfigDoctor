name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  GOFLAGS: -trimpath
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go vet ./...
      - run: go test ./...
      - name: Install matching Wails CLI
        shell: pwsh
        run: |
          $Version = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          go install "github.com/wailsapp/wails/v2/cmd/wails@$Version"
      - run: wails build -clean -s -webview2 browser
      - run: ./scripts/package.ps1 -Tag v1.1.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ConfigDoctor-release-candidate-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          retention-days: 14
