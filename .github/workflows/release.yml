name: Windows portable release
on:
  push:
    tags: ["v*"]
env:
  GOFLAGS: -trimpath
  RELEASE_TAG: ${{ github.ref_name }}
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go vet ./...
      - run: go test ./...
      - name: Install matching Wails CLI
        shell: pwsh
        run: |
          $Version = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          go install "github.com/wailsapp/wails/v2/cmd/wails@$Version"
      - name: Set tagged product version
        shell: pwsh
        run: |
          $Version = $env:RELEASE_TAG -replace '^v',''
          if ($Version -notmatch '^\d+\.\d+\.\d+$') { throw 'Only stable semantic release tags are supported.' }
          $Config = Get-Content wails.json -Raw | ConvertFrom-Json
          if ($Config.info.productVersion -ne $Version) { throw 'Tag does not match checked-in product version' }
          $Config.info.productVersion = $Version
          $Config | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8NoBOM
      - run: wails build -clean -s -webview2 browser
      - run: ./scripts/package.ps1 -Tag $env:RELEASE_TAG
      - name: Attest release ZIP provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/ConfigDoctor-*-win-x64.zip'

      - name: Publish explicitly tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Tag = $env:RELEASE_TAG
          gh release create $Tag "artifacts/ConfigDoctor-$Tag-win-x64.zip" "artifacts/ConfigDoctor-$Tag-win-x64.zip.sha256" --verify-tag --title "Config Doctor $Tag" --generate-notes
